<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="50%" style="stop-color:#f0d080"/>
      <stop offset="100%" style="stop-color:#b8862d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Pyramid silhouette -->
  <polygon points="400,120 150,520 650,520" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.6"/>
  <polygon points="400,160 180,520 620,520" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.4"/>
  <circle cx="400" cy="300" r="120" fill="url(#g)" opacity="0.15"/>
  <circle cx="400" cy="300" r="80" fill="url(#g)" opacity="0.2"/>
  <text x="400" y="500" text-anchor="middle" fill="#d4a843" opacity="0.5" font-family="serif" font-size="20">Historical Image</text>
  <text x="400" y="530" text-anchor="middle" fill="#d4a843" opacity="0.3" font-family="serif" font-size="14">Upload via admin panel</text>
</svg>
